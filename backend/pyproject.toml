[project]
name = "dgs-workspace-api"
version = "0.1.0"
description = "DGS Project & Engineering Intelligence Workspace API"
authors = [
    { name = "EmmanuelAdubi", email = "emmanuel.adubidsit@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.34",
    "python-pptx>=1.0.2",
    "reportlab>=5.1.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
voice = [
    "av>=14,<16",
    "faster-whisper>=1.2.1",
]


[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI dependency injection uses Depends()/Query() in defaults

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"app/seed_data.py" = ["E501", "E741"]  # prose content; short M/R/O constants aid readability
"app/services/ai/features.py" = ["E501"]  # prompt prose
"tests/test_tracker*.py" = ["E501"]  # Markdown tracker fixtures keep real table rows on one line
