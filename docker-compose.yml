services:
  db:
    image: postgres:17-alpine
    container_name: dgs-workspace-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dgs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dgs_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-dgs_workspace}
    ports:
      # Bound to localhost only: never expose the development database to the network.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - dgs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dgs}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dgs_pgdata:
